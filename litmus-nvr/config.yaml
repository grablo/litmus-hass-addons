# Litmus NVR — Home Assistant add-on manifest
name: Litmus NVR
version: "2.3.0"
slug: litmus_nvr
description: AI camera search and alerts for your existing IP cameras, next to Home Assistant
url: https://litmusnvr.com
arch:
  - amd64
  - aarch64

# Pre-built image published by CI (see .github/workflows/build-addon.yml). The
# Supervisor substitutes {arch} (amd64/aarch64) and pulls it — no on-device build.
# The image tag tracks `version` above.
image: "ghcr.io/grablo/{arch}-addon-litmus-nvr"

# litmus runs its own process (entrypoint) as the add-on's main process.
init: false

# Restart the add-on when Litmus stops answering (hang) or exits (crash, out of memory) — once the user turns on Watchdog
# (Supervisor default off). The health route answers while stopped too, so a stopped NVR is not restarted. Frigate's add-on does
# the same (`watchdog: http://[HOST]:[PORT:5000]/`). 2026-11-14 HAOS 18.4 test: killed for memory, the add-on stayed down.
watchdog: "http://[HOST]:[PORT:8128]/api/v1/health"

# WebRTC P2P + outbound MQTT need the host network.
host_network: true

# Open the Litmus screen inside Home Assistant (sidebar), as the Frigate add-on does.
# HA proxies /api/hassio_ingress/<token>/ to this port; the controller trusts only
# ingress requests from the Supervisor (172.30.32.2) and skips the local login for
# them (HA has already signed the user in — admins only, panel_admin defaults to true).
# Controller 2.4.0+ (older images show the login screen inside the panel).
ingress: true
ingress_port: 8128
panel_icon: mdi:cctv
panel_title: Litmus NVR

# Show up under Settings › Devices & services › Discovered when Home Assistant is turned on in
# Litmus (the add-on image has no mDNS responder, so zeroconf cannot find it). The controller
# (2.4.0+) posts {host, port, id} to the Supervisor discovery API; the Litmus NVR integration
# picks it up in async_step_hassio — the way the Mosquitto and Z-Wave JS add-ons are found.
# No hassio_api needed: the Supervisor lets every add-on call /discovery and /addons/self/info
# (supervisor api/middleware/security.py api_bypass; checked on HAOS 18.4 without it, 2026-11-14).
discovery:
  - litmus_nvr

# Grant the Supervisor-proxied Core API + inject SUPERVISOR_TOKEN, so Litmus can
# talk to Home Assistant as an add-on WITHOUT the user creating a Long-Lived token.
# (The controller auto-detects SUPERVISOR_TOKEN and uses http://supervisor/core/…;
#  if the user configures an explicit host+LLAT, that takes priority — e.g. remote HA.)
homeassistant_api: true

# Supervisor injects PulseAudio → TTS / STT / media. (Verified working in a container.)
audio: true

# Device enumeration (USB hot-plug, V4L2 camera lookup).
udev: true

# Hardware access (no full_access / privileged needed):
#   video: host video nodes /dev/video* — USB camera (AI video, V4L2)
#   usb:   raw USB /dev/bus/usb + hot-plug
#   uart:  serial / UART devices (Modbus RTU, Zigbee dongle), incl. /dev/serial/by-id
video: true
usb: true
uart: true

# Device identity, settings, models, keys and Zigbee pairing persist on the add-on's
# /data volume (handled by the entrypoint), so they survive updates and restarts.
# No options to configure — everything is set up in the Litmus web app.

# ── Camera (AI vision) ───────────────────────────────────────────────────────
# USB cameras work without full_access/privileged: the controller enumerates and
# captures them via V4L2 (/dev/video*), exposed by `video: true` above.
# (CSI cameras need libcamera + broad access — out of scope.)
# If a specific camera still isn't detected, attach its node(s) explicitly:
#   devices:
#     - /dev/video0
#     - /dev/media0
